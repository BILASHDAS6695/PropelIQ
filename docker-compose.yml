version: "3.9"

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  healthplatform:
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

# ─── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hp_postgres
    restart: unless-stopped
    env_file: .env.docker
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - healthplatform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hp_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - healthplatform
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── .NET API ────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./src
      dockerfile: HealthPlatform.Api/Dockerfile
      target: development
    container_name: hp_api
    restart: unless-stopped
    env_file: .env.docker
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5013
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
        Maximum Pool Size=100
    volumes:
      - ./src:/app/src:cached
    ports:
      - "${API_PORT:-5013}:5013"
    networks:
      - healthplatform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5013/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ── Python AI Service ───────────────────────────────────────────────────────
  ai:
    build:
      context: ./src/ai-service
      dockerfile: Dockerfile
      target: development
    container_name: hp_ai
    restart: unless-stopped
    env_file: .env.docker
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PORT: ${AI_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./src/ai-service:/app:cached
    ports:
      - "${AI_PORT:-8000}:8000"
    networks:
      - healthplatform
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ── Angular Dev Server ──────────────────────────────────────────────────────
  web:
    build:
      context: ./src/health-platform-ui
      dockerfile: Dockerfile
      target: development
    container_name: hp_web
    restart: unless-stopped
    environment:
      NODE_ENV: development
    volumes:
      - ./src/health-platform-ui:/app:cached
      - /app/node_modules
    ports:
      - "${WEB_PORT:-4200}:4200"
    networks:
      - healthplatform
    depends_on:
      api:
        condition: service_healthy
